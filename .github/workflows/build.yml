name: Build

# Mac·Windows 실행파일을 만들고, 만든 실행파일로 self-test(Qt·리소스·Playwright 드라이버·Chrome 실행)를 돌린다.
# - PR: 빌드·self-test만 한다 (결과물은 올리지 않는다)
# - develop push: 결과물을 Actions 실행 페이지의 Artifacts에 3일간 올린다 (저장 공간 한도 #86)
# - main push: 결과물을 GitHub Release(app-날짜-커밋)로 올린다. Release는 Artifacts 한도와 별개다

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    paths:
      - "app/packaging/**"
      - "app/pyproject.toml"
      - "app/uv.lock"
      - "app/src/account_cleaner/main.py"
      - "app/src/account_cleaner/core/**"
      - "app/src/account_cleaner/mail/gmail.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon(arm64)
            name: macos
          - os: windows-latest
            name: windows
    defaults:
      run:
        working-directory: app
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: 의존성 설치
        run: uv sync --locked

      - name: pytest
        run: uv run pytest

      # 배포 빌드에 Gmail 클라이언트 ID를 넣는다. 저장소에는 없고 GitHub secret에만 있다.
      - name: Gmail 클라이언트 ID 넣기 (secret이 있을 때만)
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRET_JSON" ]; then
            mkdir -p src/account_cleaner/resources
            printf '%s' "$GOOGLE_CLIENT_SECRET_JSON" > src/account_cleaner/resources/google_client_secret.json
            echo "Gmail 클라이언트 ID 포함"
          else
            echo "GOOGLE_CLIENT_SECRET_JSON 없음 - Gmail 연결 없이 빌드"
          fi

      - name: PyInstaller 빌드
        run: uv run pyinstaller --noconfirm packaging/account_cleaner.spec

      - name: self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/AccountCleaner.app/Contents/MacOS/AccountCleaner --self-test --require-chrome --report self-test.txt

      - name: self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # 창 모드 실행파일은 그냥 실행하면 기다리지 않으므로 Start-Process -Wait로 종료 코드를 받는다.
        run: |
          $p = Start-Process dist\AccountCleaner\AccountCleaner.exe -Wait -PassThru `
            -ArgumentList '--self-test','--require-chrome','--report',"$PWD\self-test.txt"
          exit $p.ExitCode

      - name: self-test 결과
        if: always()
        shell: bash
        run: cat self-test.txt || echo "보고서 없음"

      - name: 압축 (macOS)
        if: runner.os == 'macOS'
        # ditto: .app 안의 심볼릭 링크·실행 권한을 그대로 보존한다
        run: ditto -c -k --keepParent dist/AccountCleaner.app AccountCleaner-macos.zip

      - name: 압축 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\AccountCleaner -DestinationPath AccountCleaner-windows.zip

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: AccountCleaner-${{ matrix.name }}
          path: app/AccountCleaner-${{ matrix.name }}.zip
          # main은 바로 Release로 옮기므로 하루만 둔다
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 3 }}

  release:
    name: release (main)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="app-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          gh release create "$tag" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AccountCleaner $tag" \
            --notes "main 빌드 ($GITHUB_SHA). Windows·macOS 실행파일. 압축을 풀고 실행하세요."
